<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Always Be Climbing</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 20% 20%, #fdf0ff 0, transparent 35%),
        radial-gradient(circle at 80% 10%, #e0f7ff 0, transparent 30%),
        radial-gradient(circle at 10% 80%, #ffe7d6 0, transparent 35%),
        linear-gradient(135deg, #ffe6f7, #e0f3ff);
      --panel: #ffffffd9;
      --border: #1b2735;
      --accent: #ff7ab6;
      --text: #1c2331;
      --muted: #51607a;
    }

    * {
      box-sizing: border-box;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      color: var(--text);
      overflow: hidden;
    }

    .confetti::before,
    .confetti::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(#ff9dcf 2px, transparent 2px),
        radial-gradient(#8ec5ff 2px, transparent 2px),
        radial-gradient(#ffd166 3px, transparent 3px),
        radial-gradient(#9effa9 2px, transparent 2px);
      background-size: 120px 120px, 140px 140px, 180px 180px, 200px 200px;
      background-position: 20px 30px, 80px 120px, 10px 50px, 50px 10px;
      opacity: 0.35;
      mix-blend-mode: screen;
    }

    .confetti::after {
      filter: blur(1px);
      opacity: 0.25;
    }

    .app {
      position: relative;
      width: min(700px, 95vw);
      max-width: 740px;
      background: var(--panel);
      border: 4px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(16, 26, 46, 0.25), inset 0 0 0 1px #ffffff;
      padding: clamp(12px, 3vw, 24px);
      display: grid;
      gap: 16px;
      overflow: hidden;
    }

    .title {
      text-align: center;
      font-size: clamp(24px, 3vw, 32px);
      font-weight: 800;
      letter-spacing: 1px;
    }

    .race-wrapper {
      position: relative;
      background: linear-gradient(#f9fbff, #edf3ff);
      border: 2px solid #ccd7ea;
      border-radius: 18px;
      padding: 16px;
      box-shadow: inset 0 12px 24px rgba(0, 0, 0, 0.06);
      min-height: 360px;
      display: grid;
      grid-template-columns: 1fr 220px;
      gap: 12px;
    }

    .race-area {
      position: relative;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 10px;
      align-items: end;
    }

    .lane {
      position: relative;
      height: 320px;
      background: linear-gradient(
          transparent 0%,
          rgba(0, 0, 0, 0.035) 5%,
          transparent 10%
        ),
        linear-gradient(180deg, #dce7f5, #f2f6fb);
      background-size: 100% 40px, 100% 100%;
      border: 2px solid #c2cde0;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
      box-shadow: inset 0 -12px 24px rgba(0, 0, 0, 0.06);
    }

    .finish-line {
      position: absolute;
      top: 8px;
      left: 0;
      right: 0;
      height: 8px;
      background: repeating-linear-gradient(
        90deg,
        rgba(255, 102, 143, 0.9) 0 8px,
        rgba(255, 255, 255, 0.9) 8px 16px
      );
      box-shadow: 0 0 0 2px #ff6b9b inset;
      z-index: 2;
    }

    .finish-bell {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 28px;
      text-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
    }

    .climber {
      position: absolute;
      bottom: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 12px;
      background: white;
      border: 2px solid #c4cfe4;
      font-weight: 700;
      color: var(--text);
      box-shadow: 0 10px 20px rgba(27, 39, 53, 0.12);
      transition: transform 0.2s ease;
    }

    .bubble {
      position: absolute;
      right: -6px;
      top: -36px;
      background: #1c9fff;
      color: #fff;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.16);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    .bubble.show {
      opacity: 1;
      transform: translateY(0);
    }

    .burst {
      position: absolute;
      padding: 8px 12px;
      border-radius: 14px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #0c111b;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      border: 3px solid #0c111b;
      transform: translate(-50%, 0) scale(0.4) rotate(-6deg);
      animation: burstPop 850ms ease forwards;
      pointer-events: none;
      z-index: 8;
    }

    .burst.boost {
      background: radial-gradient(circle, #fff3ff 0%, #ffb7e1 90%);
      box-shadow: 0 12px 22px rgba(255, 79, 139, 0.35);
    }

    .burst.slip {
      background: radial-gradient(circle, #fff6f1 0%, #ffd5a8 90%);
      box-shadow: 0 12px 22px rgba(255, 163, 79, 0.28);
    }

    @keyframes burstPop {
      0% {
        opacity: 0;
        transform: translate(-50%, 6px) scale(0.4) rotate(-6deg);
      }
      45% {
        opacity: 1;
        transform: translate(-50%, -6px) scale(1.05) rotate(1deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -28px) scale(0.65) rotate(-4deg);
      }
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      align-content: start;
    }

    .countdown {
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ff4f8b;
    }

    .betting {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
    }

    .bet-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 12px;
      border: 2px solid #c2cde0;
      background: #f4f7fd;
      cursor: pointer;
      transition: all 0.18s ease;
      font-weight: 700;
      color: var(--text);
    }

    .bet-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
    }

    .bet-btn.selected {
      border-color: var(--accent);
      background: #ffe6f4;
      box-shadow: 0 10px 22px rgba(255, 106, 170, 0.35);
    }

    .odds {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .start-btn {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #ff7ab6, #ff4f8b);
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(255, 79, 139, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .start-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .start-btn:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 32px rgba(255, 79, 139, 0.4);
    }

    .warning {
      color: #d7263d;
      font-size: 13px;
      min-height: 18px;
    }

    .race-log {
      background: #0e1a2b;
      color: #e9f0ff;
      border-radius: 12px;
      padding: 10px;
      font-size: 13px;
      min-height: 120px;
      max-height: 200px;
      overflow-y: auto;
      box-shadow: inset 0 0 0 1px #203452;
    }

    .result-banner {
      position: absolute;
      inset: 0;
      background: #0c111b99;
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 10;
    }

    .result-banner.show {
      opacity: 1;
      pointer-events: all;
    }

    .result-card {
      background: white;
      border-radius: 18px;
      padding: 18px 22px;
      text-align: center;
      border: 2px solid var(--border);
      box-shadow: 0 16px 36px rgba(12, 17, 27, 0.28);
      max-width: 320px;
    }

    .result-card h3 {
      margin: 0 0 8px;
    }

    .result-card button {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      background: #ff7ab6;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .race-wrapper {
        grid-template-columns: 1fr;
      }
      .lane {
        height: 260px;
      }
      .race-area {
        grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
      }
    }
  </style>
</head>
<body class="confetti">
  <div class="app">
    <div class="title">Always Be Climbing</div>
    <div class="race-wrapper">
      <div class="race-area" id="raceArea">
        <div class="finish-line"></div>
        <div class="finish-bell">🔔</div>
      </div>
      <div class="controls">
        <div class="countdown" id="countdown"></div>
        <div class="betting" id="betting"></div>
        <button class="start-btn" id="startBtn">Start Race</button>
        <div class="warning" id="warning"></div>
        <div class="race-log" id="raceLog"></div>
      </div>
      <div class="result-banner" id="resultBanner">
        <div class="result-card">
          <h3 id="resultTitle"></h3>
          <p id="resultText"></p>
          <button id="closeResult">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Simple climber data with emojis and fun odds text
    const climbers = [
      { name: "Monkey", emoji: "🐵", odds: "2/1", color: "#ffd166", baseSpeed: 1.15 },
      { name: "Dwarf", emoji: "🧔‍♂️", odds: "5/1", color: "#9ad5ff", baseSpeed: 0.95 },
      { name: "Goblin", emoji: "🧌", odds: "10/1", color: "#c2f5b6", baseSpeed: 0.82 },
      { name: "Robot", emoji: "🤖", odds: "4/1", color: "#e8e9ff", baseSpeed: 1.05 },
      { name: "Jester", emoji: "🤡", odds: "8/1", color: "#ffd6f2", baseSpeed: 0.9 },
    ];

    const burstWords = {
      boost: ["WOOSH!"],
      slip: ["SLIP!"]
    };

    const raceArea = document.getElementById("raceArea");
    const betting = document.getElementById("betting");
    const startBtn = document.getElementById("startBtn");
    const countdownEl = document.getElementById("countdown");
    const warningEl = document.getElementById("warning");
    const raceLog = document.getElementById("raceLog");
    const resultBanner = document.getElementById("resultBanner");
    const resultTitle = document.getElementById("resultTitle");
    const resultText = document.getElementById("resultText");
    const closeResult = document.getElementById("closeResult");

    const state = {
      selected: null,
      raceTimer: null,
      positions: new Map(),
      inCountdown: false,
      racing: false,
      raceFactors: new Map(),
    };

    // Build the lane elements and bet buttons
    function setupClimbers() {
      climbers.forEach((climber, index) => {
        // Create lane
        const lane = document.createElement("div");
        lane.className = "lane";
        lane.dataset.index = index;
        lane.style.backgroundColor = climber.color;

        // Climber element
        const climberEl = document.createElement("div");
        climberEl.className = "climber";
        climberEl.innerHTML = `<span>${climber.emoji}</span><span>${climber.name}</span>`;
        climberEl.dataset.index = index;

        // Speech bubble for events
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.dataset.index = index;
        lane.appendChild(bubble);
        lane.appendChild(climberEl);
        raceArea.appendChild(lane);

        state.positions.set(index, 0);

        // Build bet button
        const btn = document.createElement("button");
        btn.className = "bet-btn";
        btn.dataset.index = index;
        btn.innerHTML = `<span>${climber.emoji} ${climber.name}</span><span class="odds">${climber.odds}</span>`;
        btn.addEventListener("click", () => selectClimber(index));
        betting.appendChild(btn);
      });
    }

    // Handle player selection
    function selectClimber(index) {
      if (state.racing || state.inCountdown) return;
      state.selected = index;
      warningEl.textContent = "";
      document.querySelectorAll(".bet-btn").forEach((btn) => {
        btn.classList.toggle("selected", Number(btn.dataset.index) === index);
      });
    }

    // Start the race flow with a quick countdown
    function startRace() {
      if (state.selected === null) {
        warningEl.textContent = "Pick a climber to bet on!";
        return;
      }
      warningEl.textContent = "";
      startBtn.disabled = true;
      disableBetButtons(true);
      prepareRaceDynamics();
      state.inCountdown = true;
      countdown(["3", "2", "1", "GO!"], () => {
        state.inCountdown = false;
        state.racing = true;
        runRace();
      });
    }

    // Simple countdown display above the lanes
    function countdown(steps, onComplete) {
      let i = 0;
      const tick = () => {
        countdownEl.textContent = steps[i];
        i++;
        if (i < steps.length) {
          setTimeout(tick, 650);
        } else {
          setTimeout(() => {
            countdownEl.textContent = "";
            onComplete();
          }, 400);
        }
      };
      tick();
    }

    function prepareRaceDynamics() {
      const raceFactors = new Map();
      climbers.forEach((_, idx) => {
        const skill = 0.9 + Math.random() * 0.2; // 0.9 - 1.1
        raceFactors.set(idx, skill);
      });
      state.raceFactors = raceFactors;
    }

    // Main race loop using requestAnimationFrame for smoothness
    function runRace() {
      const lanes = Array.from(document.querySelectorAll(".lane"));
      const climberEls = Array.from(document.querySelectorAll(".climber"));

      const step = () => {
        lanes.forEach((lane, idx) => {
          const maxHeight = lane.clientHeight - 24; // padding for top line
          let pos = state.positions.get(idx) || 0;
          const baseMove = (Math.random() * 0.24 + 0.12) *
            climbers[idx].baseSpeed *
            (state.raceFactors.get(idx) || 1);
          pos += baseMove;

          // Chance for boost or slip
          if (Math.random() < 0.03) {
            triggerRandomEventFor(idx, lane, pos);
          }

          // Clamp so we don't exceed lane height
          pos = Math.min(pos, maxHeight);
          state.positions.set(idx, pos);

          const climberEl = climberEls[idx];
          climberEl.style.transform = `translateY(-${pos}px)`;
          if (pos >= maxHeight - 4) {
            endRace(climbers[idx]);
          }
        });

        if (state.racing) {
          state.raceTimer = requestAnimationFrame(step);
        }
      };

      state.raceTimer = requestAnimationFrame(step);
    }

    // Boost or slip events with quick bubble feedback
    function triggerRandomEventFor(index, lane, pos) {
      const bubble = lane.querySelector(".bubble");
      const isBoost = Math.random() > 0.45;
      const delta = isBoost ? Math.random() * 8 + 6 : -(Math.random() * 6 + 4);
      const label = isBoost ? "BOOST!" : "SLIP!";
      const burstLabel = isBoost
        ? burstWords.boost[Math.floor(Math.random() * burstWords.boost.length)]
        : burstWords.slip[Math.floor(Math.random() * burstWords.slip.length)];

      logEvent(`${climbers[index].name} ${isBoost ? "got a" : "had a"} ${label}`);

      const newPos = Math.max(0, pos + delta);
      state.positions.set(index, newPos);

      createBurst(lane, newPos, burstLabel, isBoost);

      // Show bubble briefly
      bubble.textContent = label;
      bubble.style.background = isBoost ? "#1c9fff" : "#ff7a3d";
      bubble.classList.add("show");
      setTimeout(() => bubble.classList.remove("show"), 700);
    }

    function createBurst(lane, pos, text, isBoost) {
      const burst = document.createElement("div");
      burst.className = `burst ${isBoost ? "boost" : "slip"}`;
      burst.textContent = text;
      const boundedBottom = Math.min(pos + 26, lane.clientHeight - 18);
      burst.style.bottom = `${boundedBottom}px`;
      burst.style.left = `${20 + Math.random() * 60}%`;
      burst.style.fontSize = `${18 + Math.random() * 12}px`;
      lane.appendChild(burst);
      setTimeout(() => burst.remove(), 900);
    }

    // Stop race and show result
    function endRace(winningClimber) {
      if (!state.racing) return;
      state.racing = false;
      cancelAnimationFrame(state.raceTimer);
      const picked = climbers[state.selected];
      const won = picked === winningClimber;
      resultTitle.textContent = won ? "You win!" : "Race finished";
      resultText.textContent = `You picked ${picked.name}. Winner: ${winningClimber.name}. ${
        won ? "🎉 You win!" : "Better luck next time!"
      }`;
      resultBanner.classList.add("show");
      resetUI();
    }

    // Clear state for next race
    function resetUI() {
      startBtn.disabled = false;
      disableBetButtons(false);
      state.positions.forEach((_, idx) => state.positions.set(idx, 0));
      document.querySelectorAll(".climber").forEach((el) => {
        el.style.transform = "translateY(0)";
      });
    }

    function disableBetButtons(disabled) {
      document
        .querySelectorAll(".bet-btn")
        .forEach((btn) => (btn.disabled = disabled));
    }

    function logEvent(text) {
      const line = document.createElement("div");
      const time = new Date().toLocaleTimeString([], { minute: "2-digit", second: "2-digit" });
      line.textContent = `[${time}] ${text}`;
      raceLog.appendChild(line);
      raceLog.scrollTop = raceLog.scrollHeight;
    }

    // Close result modal
    closeResult.addEventListener("click", () => {
      resultBanner.classList.remove("show");
    });

    // Hook up start button
    startBtn.addEventListener("click", startRace);

    // Initialize
    setupClimbers();
    logEvent("Welcome! Place your bet and start the race.");
  </script>
</body>
</html>
